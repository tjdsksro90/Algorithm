# 매일 밤 9시(한국 시간)에 queue 브랜치에서 파일 1개를 꺼내 main에 커밋합니다.
# - queue 브랜치에 "파일 1개 = 커밋 1개"로 쌓아두면 넣은 순서대로 하루에 하나씩 올라갑니다.
# - 이미 main에 같은 내용이 올라간 커밋은 자동으로 건너뜁니다.
# - 그날(한국 시간) 이미 잔디가 있으면 커밋하지 않고 다음 날로 미룹니다.
# - Actions 탭에서 수동 실행할 때 dry_run을 켜두면 실제로 푸시하지 않고 다음 차례만 보여줍니다.
name: daily-queue-commit

on:
  schedule:
    - cron: '0 12 * * *' # UTC 12:00 = 한국 시간 21:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: '푸시하지 않고 다음 차례만 확인'
        type: boolean
        default: true
      test_notify:
        description: '알림 테스트 이슈 만들기'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-queue-commit

jobs:
  commit-next:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 오늘(한국 시간) 이미 잔디가 찍혔는지 확인 — 다른 저장소 작업 포함, 프로필 잔디와 같은 기준
      - name: 오늘 잔디 확인
        id: today
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from=$(date '+%Y-%m-%dT00:00:00+09:00')
          to=$(date '+%Y-%m-%dT23:59:59+09:00')
          n=$(gh api graphql \
            -f query='query($u:String!,$f:DateTime!,$t:DateTime!){user(login:$u){contributionsCollection(from:$f,to:$t){contributionCalendar{totalContributions}}}}' \
            -f u="$GITHUB_REPOSITORY_OWNER" -f f="$from" -f t="$to" \
            --jq '.data.user.contributionsCollection.contributionCalendar.totalContributions') || n=''
          if [ -z "$n" ]; then
            echo '오늘 잔디를 확인하지 못했어요. 그대로 진행합니다.'
            n=0
          fi
          echo "오늘 잔디: $n"
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - name: queue에서 다음 파일 커밋
        id: commit
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TODAY_COUNT: ${{ steps.today.outputs.count }}
        run: |
          git config core.quotepath false
          git config user.name 'hojun.yoon'
          git config user.email 'tjdsksro90@gmail.com'

          if ! git ls-remote --exit-code --heads origin queue >/dev/null; then
            echo 'queue 브랜치가 없어서 종료합니다.'
            exit 0
          fi
          git fetch origin queue

          # main에 아직 같은 내용이 없는 queue 커밋 중 가장 오래된 것
          next=$(git rev-list --reverse --right-only --cherry-pick --no-merges main...origin/queue | head -n 1)
          if [ -z "$next" ]; then
            echo '대기열이 비어 있어요. 오늘은 커밋하지 않습니다.'
            exit 0
          fi

          remaining=$(git rev-list --right-only --cherry-pick --no-merges main...origin/queue | wc -l)
          echo "다음 차례: $(git log -1 --format=%s "$next") (남은 개수: $remaining)"

          if [ "${TODAY_COUNT:-0}" -gt 0 ]; then
            echo "오늘 이미 잔디가 ${TODAY_COUNT}개 있어서 건너뜁니다. 이 파일은 내일 다시 시도해요."
            exit 0
          fi

          git cherry-pick --no-commit "$next"
          git commit -C "$next" --reset-author
          git show --stat --format='%h %ad | %an <%ae>%n%s' HEAD

          if [ "$DRY_RUN" = 'true' ]; then
            echo 'dry_run이라 푸시하지 않습니다.'
            exit 0
          fi
          git push origin HEAD:main

          left=$((remaining - 1))
          echo "left=$left" >> "$GITHUB_OUTPUT"
          echo "last=$(git log -1 --format=%s HEAD)" >> "$GITHUB_OUTPUT"

      # 남은 개수가 3개일 때, 그리고 마지막 파일이 올라간 날에 이슈로 알림 (GitHub 메일/앱 알림)
      - name: 대기열 알림
        if: steps.commit.outputs.left == '3' || steps.commit.outputs.left == '0' || inputs.test_notify
        env:
          GH_TOKEN: ${{ github.token }}
          LEFT: ${{ steps.commit.outputs.left }}
          LAST: ${{ steps.commit.outputs.last }}
          TEST: ${{ inputs.test_notify }}
        run: |
          today=$(date '+%Y-%m-%d')
          if [ "$TEST" = 'true' ]; then
            title="[테스트] 대기열 알림이 잘 오는지 확인"
            body="알림 테스트예요. 이 메시지가 보이면 대기열 알림이 정상이에요. 이 이슈는 닫아도 돼요."
          elif [ "$LEFT" = '0' ]; then
            title="📭 대기열이 비었어요 ($today)"
            body="오늘 마지막 파일이 올라갔어요: $LAST"$'\n\n'"내일부터는 자동 커밋이 없어요. 잔디를 이어가려면 새 작업을 푸시하거나 대기열에 넣어주세요."
          else
            title="⏳ 대기열 ${LEFT}개 남았어요 ($today)"
            body="오늘 올라간 파일: $LAST"$'\n\n'"앞으로 ${LEFT}일 뒤에 대기열이 비어요. 미리 대기열에 파일을 넣어두세요."
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --assignee tjdsksro90
